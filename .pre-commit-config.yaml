default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: backend-format
        name: backend ruff format check
        entry: bash -lc 'ROOT_DIR="$(pwd)"; PYTHON_BIN="${PYTHON:-python3}"; if [ -x "$ROOT_DIR/backend/.venv/bin/python" ]; then PYTHON_BIN="$ROOT_DIR/backend/.venv/bin/python"; fi; cd backend && "$PYTHON_BIN" -m ruff format --check app ../scripts/check_schema.py ../scripts/cleanup_orphan_media.py ../scripts/quality/check_frontend_bundle.py ../scripts/quality/css_token_gate.py ../scripts/quality/perf_seed.py ../scripts/quality/perf_smoke.py ../scripts/quality/smoke.py'
        language: system
        pass_filenames: false
        files: ^(backend/app/.*\.py|scripts/check_schema\.py|scripts/cleanup_orphan_media\.py|scripts/quality/(check_frontend_bundle|css_token_gate|perf_seed|perf_smoke|smoke)\.py)$
      - id: backend-ruff
        name: backend ruff
        entry: bash -lc 'ROOT_DIR="$(pwd)"; PYTHON_BIN="${PYTHON:-python3}"; if [ -x "$ROOT_DIR/backend/.venv/bin/python" ]; then PYTHON_BIN="$ROOT_DIR/backend/.venv/bin/python"; fi; cd backend && "$PYTHON_BIN" -m ruff check app ../scripts/check_schema.py ../scripts/cleanup_orphan_media.py ../scripts/quality/check_frontend_bundle.py ../scripts/quality/css_token_gate.py ../scripts/quality/perf_seed.py ../scripts/quality/perf_smoke.py ../scripts/quality/smoke.py'
        language: system
        pass_filenames: false
        files: ^(backend/app/.*\.py|scripts/check_schema\.py|scripts/cleanup_orphan_media\.py|scripts/quality/(check_frontend_bundle|css_token_gate|perf_seed|perf_smoke|smoke)\.py)$
      - id: css-token-gate
        name: css token gate
        entry: bash -lc 'ROOT_DIR="$(pwd)"; PYTHON_BIN="${PYTHON:-python3}"; if [ -x "$ROOT_DIR/backend/.venv/bin/python" ]; then PYTHON_BIN="$ROOT_DIR/backend/.venv/bin/python"; fi; "$PYTHON_BIN" scripts/quality/css_token_gate.py'
        language: system
        pass_filenames: false
        files: ^(frontend/src/(styles|design)/.*\.css|scripts/quality/css_token_gate\.py)$
      - id: frontend-lint
        name: frontend lint
        entry: bash -lc 'cd frontend && npm run lint'
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(ts|tsx)$
      - id: frontend-format
        name: frontend prettier check
        entry: bash -lc 'cd frontend && npm run format:check'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(css|html|json|md|ts|tsx|js|mjs)$
      - id: frontend-knip
        name: frontend knip
        entry: bash -lc 'cd frontend && npm run knip'
        language: system
        pass_filenames: false
        stages:
          - pre-push
      - id: backend-pytest
        name: backend pytest
        entry: bash -lc 'ROOT_DIR="$(pwd)"; PYTHON_BIN="${PYTHON:-python3}"; if [ -x "$ROOT_DIR/backend/.venv/bin/python" ]; then PYTHON_BIN="$ROOT_DIR/backend/.venv/bin/python"; fi; cd backend && "$PYTHON_BIN" -m pytest'
        language: system
        pass_filenames: false
        stages:
          - pre-push
      - id: backend-coverage
        name: backend coverage
        entry: bash -lc 'ROOT_DIR="$(pwd)"; PYTHON_BIN="${PYTHON:-python3}"; if [ -x "$ROOT_DIR/backend/.venv/bin/python" ]; then PYTHON_BIN="$ROOT_DIR/backend/.venv/bin/python"; fi; cd backend && "$PYTHON_BIN" -m coverage run -m pytest && "$PYTHON_BIN" -m coverage report'
        language: system
        pass_filenames: false
        stages:
          - pre-push
      - id: frontend-test
        name: frontend test
        entry: bash -lc 'cd frontend && npm run test'
        language: system
        pass_filenames: false
        stages:
          - pre-push
