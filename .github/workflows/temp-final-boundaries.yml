name: Temporary final boundaries publisher

on:
  push:
    branches:
      - work/photomap-final-boundaries-20260919

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish exact tested files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/final-boundaries.tar.gz
          tar -xzf /tmp/final-boundaries.tar.gz
          git rm .github/workflows/temp-final-boundaries.yml
          git add frontend/src/components/admin/usePlaceFormDraft.ts \
            frontend/src/components/admin/usePlaceLocationAutoSave.ts \
            frontend/src/components/map/PlaceMarker.tsx \
            frontend/src/components/map/mapMotion.test.ts \
            frontend/src/components/map/mapMotion.ts \
            frontend/src/components/map/placeMarkerMotion.test.ts \
            frontend/src/components/map/placeMarkerMotion.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Separate final map and location responsibilities"
          git push origin HEAD:work/photomap-final-boundaries-20260919
